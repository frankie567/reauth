name: Build

on: [push, pull_request]

permissions:
    contents: read

jobs:
    test:
        runs-on: ubuntu-latest
        strategy:
            matrix:
                python_version: ['3.14']

        steps:
            - name: Harden the runner (Audit all outbound calls)
              uses: step-security/harden-runner@e14015d583714f6e62063499dc959a02595150a1 # v2.21.1
              with:
                egress-policy: audit

            - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
              with:
                  persist-credentials: false
            - name: Set up Python
              uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
              with:
                  python-version: ${{ matrix.python_version }}
            - name: Setup Just
              uses: extractions/setup-just@53165ef7e734c5c07cb06b3c8e7b647c5aa16db3 # v4.0.0
            - name: Install uv and set the Python version
              uses: astral-sh/setup-uv@37802adc94f370d6bfd71619e3f0bf239e1f3b78 # v7.6.0
              with:
                  python-version: ${{ matrix.python_version }}
            - name: Install the project
              run: uv sync --locked --all-extras --dev
            - name: Lint and typecheck
              run: |
                  just lint-check
            - name: Test
              run: |
                  just test-cov-xml
            - name: Validate release tag
              if: startsWith(github.ref, 'refs/tags/')
              run: |
                  [[ "$GITHUB_REF_NAME" =~ ^v[0-9]+\.[0-9]+\.[0-9]+([ab][0-9]+|rc[0-9]+)?$ ]]
                  test "$GITHUB_REF_NAME" = "v$(uv run --locked python -c 'import reauth; print(reauth.__version__)')"
            - name: Build distributions
              run: just build
            - name: Prepare release notes and hashes
              if: startsWith(github.ref, 'refs/tags/')
              run: |
                  just release-notes "${GITHUB_REF_NAME#v}" > "dist/reauth-${GITHUB_REF_NAME}-release-notes.md"
                  test -s "dist/reauth-${GITHUB_REF_NAME}-release-notes.md"
                  cd dist
                  sha256sum *.whl *.tar.gz *-release-notes.md > SHA256SUMS
            - name: Upload release assets
              if: startsWith(github.ref, 'refs/tags/')
              uses: actions/upload-artifact@4cec3d8aa04e39d1a68397de0c4cd6fb9dce8ec1 # v4.6.1
              with:
                  name: distributions
                  path: dist/
                  if-no-files-found: error
            - uses: codecov/codecov-action@303a32d7a59b442fa8d48b6a1cc6825c09c847a5 # v7.1.1
              with:
                  token: ${{ secrets.CODECOV_TOKEN }}
                  fail_ci_if_error: true
                  verbose: true

    security-analysis:
        permissions:
            contents: read
            security-events: write
        uses: ./.github/workflows/codeql.yml

    tests-passed:
        runs-on: ubuntu-latest
        permissions: {}
        needs: test
        if: always()
        steps:
            - env:
                  TEST_RESULT: ${{ needs.test.result }}
              run: |
                  test "$TEST_RESULT" = success

    release:
        runs-on: ubuntu-latest
        environment: release
        needs: [tests-passed, security-analysis]
        if: github.event_name == 'push' && startsWith(github.ref, 'refs/tags/')
        permissions:
            contents: write
            id-token: write
            attestations: write

        steps:
            - name: Harden the runner (Audit all outbound calls)
              uses: step-security/harden-runner@e14015d583714f6e62063499dc959a02595150a1 # v2.21.1
              with:
                egress-policy: audit

            - name: Download tested distributions
              uses: actions/download-artifact@634f93cb2916e3fdff6788551b99b062d0335ce0 # v5
              with:
                  name: distributions
                  path: dist/
            - name: Attest release assets
              uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
              with:
                  subject-path: dist/*
            - name: Install uv
              uses: astral-sh/setup-uv@37802adc94f370d6bfd71619e3f0bf239e1f3b78 # v7.6.0
            - name: Publish on PyPI
              run: uv publish --trusted-publishing always dist/*.whl dist/*.tar.gz
            - name: Create release
              uses: ncipollo/release-action@339a81892b84b4eeb0f6e744e4574d79d0d9b8dd # v1.21.0
              with:
                  draft: true
                  bodyFile: dist/reauth-${{ github.ref_name }}-release-notes.md
                  artifacts: dist/*
                  token: ${{ secrets.GITHUB_TOKEN }}
